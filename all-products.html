<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>All Products — Serenité Jewelry</title>
<style>
:root{--bg:#fffafc;--card:#fff;--muted:#6b5d65;--primary:#d98fa2;--shadow:0 6px 18px rgba(18,18,18,0.06);--maxwidth:1100px;font-family:Inter,system-ui,Arial}
body{margin:0;background:linear-gradient(180deg,var(--bg),#fff);color:#222;-webkit-font-smoothing:antialiased}
.container{width:90%;max-width:var(--maxwidth);margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}
.logo .mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#fff,#f7eef2);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-weight:700;color:var(--primary)}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin-left:12px}
.cart-btn{position:relative;background:#fff;border:1px solid #f0e6ea;padding:8px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow)}
.cart-count{position:absolute;top:-6px;right:-6px;background:var(--primary);color:white;border-radius:50%;width:18px;height:18px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:18px}
.product-card{background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.product-media{height:220px;border-radius:10px;overflow:hidden;background:#faf7fb;display:flex;align-items:center;justify-content:center}
.product-media img{width:100%;height:100%;object-fit:cover}
.product-info{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:72px;margin-top:10px}
.product-card .btn{margin-top:auto}

.btn{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.small{font-size:13px;color:var(--muted)}

#backdrop{position:fixed;inset:0;background:rgba(10,10,10,0.35);display:none;z-index:900}
.cart-drawer{position:fixed;right:20px;top:70px;width:360px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 30px 60px rgba(17,17,17,0.18);transform:translateX(120%);transition:transform .28s ease-in-out;z-index:1000;display:flex;flex-direction:column;max-height:calc(100vh - 100px);}
.cart-drawer.open{transform:translateX(0)}
.cart-items-scroll{overflow-y:auto;flex:1;margin-top:8px;padding-right:4px;}
.cart-items-scroll::-webkit-scrollbar{width:6px;}
.cart-items-scroll::-webkit-scrollbar-thumb{background-color:#ddd;border-radius:6px;}
.cart-item{display:flex;gap:12px;margin-bottom:12px;align-items:center}
.cart-item img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.banner{position:fixed;right:20px;bottom:24px;background:#111;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:all .35s;z-index:1200}
.banner.show{opacity:1;transform:translateY(0)}
footer{padding:28px 0;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header class="container">
  <a class="logo" href="index.html"><div class="mark">S</div><div><div style="font-weight:800">Serenité</div><div class="small">Handmade Pearls & Beads</div></div></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="current-collections.html">Collections</a>
    <button class="cart-btn" id="openCartBtn" aria-label="Open cart">🛍️<div class="cart-count" id="cartCount">0</div></button>
  </nav>
</header>

<main class="container">
  <h1>All Products</h1>
  <p class="small">Hover to see the piece on a model (placeholder images for now).</p>
  <div class="grid" id="productGrid"></div>
</main>

<!-- Drawer + backdrop + banner -->
<div id="backdrop"></div>
<aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-shrink:0;">
    <div style="font-weight:800">Your Cart</div>
    <button id="closeCartBtn" class="btn btn-ghost">Close</button>
  </div>

  <div id="cartItems" class="cart-items-scroll"></div>

  <div style="margin-top:12px;border-top:1px solid #f3edf0;padding-top:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div><div class="small">Subtotal</div><div style="font-weight:800" id="cartSubtotal">$0.00</div></div>
    <a href="checkout.html" class="btn btn-primary" id="proceedCheckout">Proceed to Checkout</a>
  </div>
</aside>
<div id="banner" class="banner">Added to cart ✓</div>

<footer class="container">© <strong>Serenité</strong></footer>

<script>
const PRODUCTS=[
  {id:'misc-01',title:'Pearl Dream Choker',price:28,images:['https://via.placeholder.com/800x800?text=Choker+Plain','https://via.placeholder.com/800x800?text=Choker+On+Model'],description:'A delicate pearl choker.'},
  {id:'misc-02',title:'Rose Bead Bracelet',price:18,images:['https://via.placeholder.com/800x800?text=Bracelet+Plain','https://via.placeholder.com/800x800?text=Bracelet+On+Model'],description:'Romantic rose-tone glass beads.'},
  {id:'misc-03',title:'Coastal Shell Drops',price:22,images:['https://via.placeholder.com/800x800?text=Shell+Plain','https://via.placeholder.com/800x800?text=Shell+On+Model'],description:'Seashell charm drops.'},
  {id:'misc-04',title:'Starry Glass Earrings',price:16,images:['https://via.placeholder.com/800x800?text=Star+Plain','https://via.placeholder.com/800x800?text=Star+On+Model'],description:'Tiny star glass accents.'}
];

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }[s])); }

document.addEventListener('DOMContentLoaded',()=>{
  const g=document.getElementById('productGrid');
  PRODUCTS.forEach(p=>{
    const card=document.createElement('div');
    card.className='product-card';
    card.innerHTML=`
      <div class='product-media'>
        <img src='${p.images[0]}' data-plain='${p.images[0]}' data-model='${p.images[1]}' alt='${escapeHtml(p.title)}'>
      </div>
      <div class='product-info'>
        <div>
          <div style='font-weight:700'>${escapeHtml(p.title)}</div>
          <div class='small'>${escapeHtml(p.description)}</div>
        </div>
        <div style='font-weight:800'>$${p.price.toFixed(2)}</div>
      </div>
      <button class='btn btn-primary'>Add to Cart</button>
    `;
    const img=card.querySelector('img');
    img.onmouseenter=()=>img.src=img.dataset.model;
    img.onmouseleave=()=>img.src=img.dataset.plain;
    card.querySelector('.btn-primary').onclick=()=>cartAPI.addToCart({ id:p.id, title:p.title, price:p.price, image:p.images[0], qty:1 });
    g.appendChild(card);
  });
});
</script>

<!-- Shared cart -->
<script src="cart.js"></script>
</body>
</html>
